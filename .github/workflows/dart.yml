name: Flutter CI

on:
  push:
    branches: [ "dev-1.0.0" ]

jobs:
  build:
    runs-on: macos-latest  # Use macOS instead of Ubuntu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Flutter with the desired version (3.24.3)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.2"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Preview Proposed Changes
        id: dry_run
        run: |
          dart fix --dry-run > dry_run_result.txt
          cat dry_run_result.txt

      - name: Fix Analysis Issues
        id: apply_fixes
        run: |
          dart fix --apply > apply_result.txt
          cat apply_result.txt

      - name: Analyze Project Source
        id: analyze
        run: |
          flutter analyze > analyze_result.txt
          cat analyze_result.txt

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          DRY_RUN_RESULT=$(cat dry_run_result.txt | sed 's/"/\\"/g')
          APPLY_RESULT=$(cat apply_result.txt | sed 's/"/\\"/g')
          ANALYZE_RESULT=$(cat analyze_result.txt | sed 's/"/\\"/g')

          curl -X POST -H 'Content-type: application/json' --data \
          '{
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🚀 Flutter CI Pipeline Result*"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🔍 Dart Fix (Dry Run):*\n```'"$DRY_RUN_RESULT"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*✅ Dart Fix (Applied):*\n```'"$APPLY_RESULT"'```"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*📊 Code Analysis Report:*"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "```'"$ANALYZE_RESULT"'```"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "🚀 *CI/CD Automation* | 🛠️ *GitHub Actions* | 🔔 *Slack Alerts*"
                  }
                ]
              }
            ]
          }' $SLACK_WEBHOOK_URL
